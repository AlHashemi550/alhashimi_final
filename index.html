<!<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شبكة الهاشمي♡ - نظام الحماية المطور</title>
    <style>
        :root { --accent: #ffb700; --glass: rgba(255, 255, 255, 0.1); }
        body {
            margin: 0; padding: 0; height: 100vh; display: flex; justify-content: center; align-items: center;
            background: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&q=80&w=2070') no-repeat center center/cover;
            font-family: sans-serif; overflow: hidden;
        }
        .glass-panel {
            background: var(--glass); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 40px;
            padding: 50px 30px; width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        h1 { font-size: 2.8rem; color: #fff; margin: 0; text-shadow: 0 0 15px var(--accent); }
        input {
            width: 85%; padding: 18px; margin: 30px 0; border-radius: 15px; border: 1px solid rgba(255,255,255,0.3);
            background: rgba(0,0,0,0.4); color: var(--accent); font-size: 1.4rem; text-align: center; outline: none;
        }
        .btn-action {
            width: 90%; padding: 18px; border-radius: 15px; border: none;
            background: linear-gradient(135deg, #ffb700, #ff8800); color: #000;
            font-weight: bold; font-size: 1.2rem; cursor: pointer;
        }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: none; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .pop-card {
            background: #111; padding: 40px; border-radius: 30px; 
            border: 2px solid var(--accent); text-align: center; box-shadow: 0 0 40px var(--accent);
        }
        .earth-fast { font-size: 100px; animation: fastSpin 0.5s linear infinite; margin-bottom: 20px; }
        @keyframes fastSpin { 100% { transform: rotate(360deg); } }
        .quran-text { color: #fff; margin-top: 25px; font-size: 0.9rem; opacity: 0.9; line-height: 1.6; }
    </style>
</head>
<body>

    <div class="glass-panel" id="mainUI">
        <h1>شبكة الهاشمي</h1>
        <input type="text" id="cardInput" placeholder="أدخل الكرت" inputmode="numeric">
        <button class="btn-action" onclick="checkCard()">دخول النظام</button>
        <div class="quran-text">
            <div>﴿وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا﴾</div>
            <div style="color: var(--accent); font-weight: bold; margin-top: 5px;">اتقِ الله واجعل الانترنت وسيلة استفادة</div>
        </div>
    </div>

    <div id="successBox" class="overlay">
        <div class="pop-card">
            <div class="earth-fast">🌍</div>
            <h2 style="color: var(--accent);">تم تسجيل الدخول بنجاح</h2>
            <p style="color: #fff;">نتمنى لكم وقتاً ممتعاً 😍🌹✨</p>
        </div>
    </div>

    <div id="errorBox" class="overlay" onclick="this.style.display='none'">
        <div class="pop-card" style="border-color: #ff4b2b;">
            <div style="font-size: 60px;">🫣</div>
            <h2 style="color: #ff4b2b;">نأسف.. الكرت خطأ</h2>
            <p style="color: #ccc;">اضغط للعودة</p>
        </div>
    </div>

    <script>
        function checkCard() {
            const val = document.getElementById('cardInput').value;
            const successBox = document.getElementById('successBox');
            const errorBox = document.getElementById('errorBox');

            if(val === "225588") {
                successBox.style.display = 'flex';
                
                // بعد 4 ثواني سيتم "تصفير" الصفحة تماماً لتبدو كأنها أغلقت
                setTimeout(() => {
                    // محاولة إغلاق النافذة (تعمل في بعض المتصفحات)
                    window.close();
                    // كخيار احتياطي أقوى: مسح محتوى الصفحة تماماً وتحويلها لشاشة سوداء
                    document.body.innerHTML = "<div style='background:#000; height:100vh; width:100vw;'></div>";
                }, 4000);

            } else {
                errorBox.style.display = 'flex';
            }
        }
    </script>
</body>
</html>
